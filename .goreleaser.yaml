# GoReleaser config for herdr-bridge (single binary, embedded web assets).
version: 2

project_name: herdrweb

before:
  hooks:
    - make web
    # `make web` rebuilds internal/webui/dist and removes the tracked .gitkeep;
    # restore it so the tree is clean, else `goreleaser release` refuses to run.
    - git checkout -- internal/webui/dist/.gitkeep

builds:
  - id: herdr-bridge
    main: ./cmd/herdr-bridge
    binary: herdr-bridge
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
